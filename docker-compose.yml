services:
  postgres:
    image: postgres:16-alpine
    container_name: insight-ai-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: insight_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: insight-ai-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: insight-ai-api
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/insight_ai?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-key
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: insight-ai-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
    container_name: insight-ai-marketing
    ports:
      - "5173:5173"

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: insight-ai-workers
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/insight_ai?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - postgres
      - redis
      - ai-service

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: insight-ai-nlp
    ports:
      - "8000:8000"

volumes:
  postgres_data:
